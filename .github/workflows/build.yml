name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore VerifiedIdHelpdesk.slnx

      - name: Build
        run: dotnet build VerifiedIdHelpdesk.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test VerifiedIdHelpdesk.slnx --no-build --configuration Release --verbosity normal
